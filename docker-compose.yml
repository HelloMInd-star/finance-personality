version: '3.8'

# ==================== 公共环境变量 ====================
x-common-env: &common-env
  SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
  LOG_LEVEL: INFO
  # CORS 白名单（逗号分隔，需配合后端 app.py 读取此环境变量）
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}

services:
  # ==================== PostgreSQL 数据库 ====================
  postgres:
    image: postgres:15-alpine
    container_name: poker-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=poker_egg
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - poker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: poker-redis
    # 开启 AOF 持久化，容器重启后数据不丢失
    # 生产环境建议添加: --requirepass "${REDIS_PASSWORD}"
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - poker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==================== 后端服务（开发环境） ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: poker-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    environment:
      <<: *common-env
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/poker_egg
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - poker-network
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 5000 --reload

  # ==================== 前端服务（开发环境） ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: poker-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Vite 代理目标：容器内通过 Docker 网络访问 backend 服务
      - VITE_PROXY_TARGET=http://backend:5000
      - VITE_WS_PROXY_TARGET=ws://backend:5000
    depends_on:
      - backend
    networks:
      - poker-network
    restart: unless-stopped

  # ==================== pgAdmin（数据库管理，开发用） ====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: poker-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - poker-network
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - devtools

  # ==================== 后端服务（生产环境） ====================
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: poker-backend-prod
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_logs:/app/logs
    environment:
      <<: *common-env
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/poker_egg
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      poker-network:
        aliases:
          - backend
    restart: unless-stopped
    profiles:
      - production

  # ==================== Nginx（生产环境 - 前端静态文件 + 反向代理） ====================
  # 说明：不再挂载外部 nginx.conf，改用 Dockerfile 内 COPY 的 frontend/nginx.conf
  #       放置到 /etc/nginx/conf.d/default.conf，由 nginx:alpine 默认主配置 include 加载
  #       如需自定义主配置（如 client_max_body_size），可取消下方注释挂载 nginx/nginx.conf
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: poker-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # SSL 证书目录（需先创建 nginx/ssl 并放入证书；无证书时注释掉此行）
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend-prod
    networks:
      - poker-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  backend_logs:
  nginx_logs:

networks:
  poker-network:
    driver: bridge
